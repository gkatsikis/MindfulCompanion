name: Deploy to Cloud Run

on:
  push:
    branches: [main]

# Never run two deploys at once; queue the latest instead
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC token for keyless GCP auth

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/686714335325/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@mindfulcompanion-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud run deploy mindfulcompanion --source . \
            --region us-east4 --project mindfulcompanion-prod --quiet
